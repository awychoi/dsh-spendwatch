name: Watch DeepSeek pricing

on:
  schedule:
    # Mondays, 06:17 UTC. Adjust if DeepSeek tends to announce changes elsewhere.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the window parser
        run: node --test scripts/pricing-parse.test.mjs

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Read DeepSeek's pricing page
        run: node scripts/watch-pricing.mjs

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Update the DeepSeek pricing snapshot'
          title: 'DeepSeek pricing page changed'
          branch: pricing-watch
          delete-branch: true
          add-paths: |
            pricing.json
            scripts/pricing-source.txt
            scripts/pricing-source.sha256
          body: |
            The weekly watcher found a change on DeepSeek's pricing page.

            - `scripts/pricing-source.txt` is the new page text; `pricing.json` gets a new period when the peak windows changed, starting at the detection time.
            - **Check the rates.** They are not parsed automatically: read `scripts/pricing-source.txt`, and if the per-million-token rates changed, edit the new period's `rates` before merging.
            - If the page states an effective date for the change, adjust the new period's `from`; otherwise the detection time is used.
            - The Client's bundled fallback (`DEFAULT_PRICING` in `client.js`) only needs the windows/periods; update it when cutting a release.

            If the page layout changed and the watcher could not parse the windows, the snapshot still lands here for a manual update.
